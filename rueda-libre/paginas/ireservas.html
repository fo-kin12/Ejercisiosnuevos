<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reservas - Rueda Libre</title>
</head>
<body>

    <header>
        <h1>Rueda Libre</h1>
        <nav>
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="tarifas.html">Tarifas</a></li>
                <li><a href="reservas.html">Reservas</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section id="formulario-reserva">
            <h2>Reserva tu bicicleta</h2>
            
            <form action="#">
                <div class="form-group">
                    <label for="nombre">Nombre completo</label>
                    <input type="text" id="nombre" name="nombre" required placeholder="Ej. Juan Pérez">
                </div>

                <div class="form-group">
                    <label for="correo">Correo electrónico</label>
                    <input type="email" id="correo" name="correo" required placeholder="correo@ejemplo.com">
                </div>

                <div class="form-group">
                    <label for="fecha">Fecha de la reserva</label>
                    <input type="date" id="fecha" name="fecha" required>
                </div>

                <div class="form-group">
                    <label for="tipo">Tipo de bicicleta</label>
                    <select id="tipo" name="tipo" required>
                        <option value="">Selecciona una opción</option>
                        <option value="urbana">Urbana</option>
                        <option value="montana">Montaña</option>
                        <option value="electrica">Eléctrica</option>
                    </select>
                </div>

                <button type="submit">Reservar</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Rueda Libre - Alquiler de Bicicletas. Todos los derechos reservados.</p>
    </footer>

</body>
</html>
